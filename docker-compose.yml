# Uso típico (todo en Docker): ver README sección «Solo Docker + Ollama».
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    # Sin publicar 11434 en el host: `moodle-quiz` usa el nombre `ollama` en la red Compose.
    # Si ya tienes Ollama nativo en el Mac (puerto 11434), publicar aquí fallaría con «address already in use».
    # Para usar Ollama desde el host en otro puerto, descomenta:
    # ports:
    #   - "127.0.0.1:11435:11434"

  moodle-quiz:
    build: .
    image: moodle-quiz:latest
    working_dir: /app
    volumes:
      - ./config.json:/app/config.json:ro
      - ./out:/app/out
    environment:
      # URL vista DESDE el contenedor moodle-quiz (nombre del servicio en la red Compose)
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
    # Opcional: cookie sin guardar en config.json
    # environment:
    #   MOODLE_QUIZ_COOKIE: ""
    # Por defecto: fetch (ver Dockerfile CMD). Ejemplos:
    #   docker compose run --rm moodle-quiz fetch --config /app/config.json --snapshot /app/out/quiz_snapshot.json
    #   docker compose run --rm -it moodle-quiz submit --config /app/config.json --dry-run
    #   docker compose run --rm -it moodle-quiz submit --config /app/config.json
    #   docker compose run --rm -it moodle-quiz ollama-answers --config /app/config.json --answers-out /app/out/answers_ollama.json

volumes:
  ollama_data: {}
