# Cliente Moodle: imagen moodle-quiz. Para IA usa Google Gemini (API en la nube).
# Pasa GEMINI_API_KEY al ejecutar gemini-answers / retake-answers (ver README).
# Si antes usabas el servicio `ollama` de este repo: `docker compose down --remove-orphans`
# para quitar contenedores huérfanos tras el cambio de compose.
services:
  moodle-quiz:
    build: .
    image: moodle-quiz:latest
    working_dir: /app
    volumes:
      - ./config.json:/app/config.json:ro
      - ./out:/app/out
    # Opcional: clave desde un .env local (añade .env a .gitignore; no lo subas)
    # env_file:
    #   - .env
    # Opcional: cookie sin guardar en config.json
    # environment:
    #   MOODLE_QUIZ_COOKIE: ""
    #   GEMINI_API_KEY: ""
    # Por defecto: fetch (ver Dockerfile CMD). Ejemplos:
    #   docker compose run --rm moodle-quiz fetch --config /app/config.json --snapshot /app/out/quiz_snapshot.json
    #   docker compose run --rm -it moodle-quiz submit --config /app/config.json --dry-run
    #   docker compose run --rm -it -e GEMINI_API_KEY moodle-quiz gemini-answers --config /app/config.json --answers-out /app/out/answers_gemini.json
